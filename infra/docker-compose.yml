services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hanbeot
      POSTGRES_PASSWORD: hanbeot
      POSTGRES_DB: hanbeot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanbeot -d hanbeot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # TODO: api 서비스 (apps/api Dockerfile 작성 후)
