  #   build: ../apps/api
  #   env_file: ../apps/api/.env
  #   depends_on:
  #     db: { condition: service_healthy }
  #   ports: ["8000:8000"]

  # TODO: web 서비스 (apps/web Dockerfile 작성 후)
  # web:
  #   build: ../apps/web
  #   ports: ["5173:5173"]

volumes:
  pgdata:
