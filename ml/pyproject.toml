[project]
name = "hanbeot-ml"
version = "0.1.0"
description = "한벗 모델 실험·평가 (apps/api를 import하지 않는다)"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scikit-learn", "pyyaml", "jsonschema"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ser", "crisis", "turn", "latency"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
